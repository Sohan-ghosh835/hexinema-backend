<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Hexinema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="landing">

    <h1 class="title"> Hexinema</h1>
    <p class="subtitle">cozy movies · shared moments · no desync </p>

    <div class="card">

      <div class="section">
        <h3>Join a Room</h3>
        <input type="text" id="roomInput" placeholder="Enter room code " />
        <button id="joinBtn">Join Room</button>
      </div>

      <div class="divider">or</div>

      <div class="section">
        <h3>Create a Room</h3>
        <button id="openCreateOverlayBtn">Create Room</button>
      </div>

    </div>


    <div id="createTypeOverlay" class="overlay" style="display: none;">
      <div class="modal">
        <h3>Select Media Type</h3>
        <button class="modal-btn" id="btnLocal">Local Video File</button>
        <button class="modal-btn" id="btnYoutube">YouTube Link</button>
        <button class="modal-btn" id="btnScreen">Screen Share</button>
        <button class="modal-btn cancel" id="cancelTypeBtn">Cancel</button>
      </div>
    </div>

    <div id="youtubeUrlOverlay" class="overlay" style="display: none;">
      <div class="modal">
        <h3>Enter YouTube URL</h3>
        <input type="text" id="youtubeLinkInput" placeholder="https://youtube.com/..." />
        <button class="modal-btn" id="confirmYoutubeBtn">Create</button>
        <button class="modal-btn cancel" id="cancelYoutubeBtn">Cancel</button>
      </div>
    </div>

    <input type="file" id="hiddenFileInput" accept="video/*" style="display: none;" />

    <div id="uploadOverlay">
      <div id="uploadBox">
        <div id="uploadText">Uploading video...</div>
        <div id="progressBar">
          <div id="progressFill"></div>
        </div>
      </div>
    </div>

  </main>

  <script>
    const BACKEND_URL = "https://hexinema-backend.onrender.com";

    const joinBtn = document.getElementById("joinBtn");
    const roomInput = document.getElementById("roomInput");


    const openCreateOverlayBtn = document.getElementById("openCreateOverlayBtn");


    const createTypeOverlay = document.getElementById("createTypeOverlay");
    const youtubeUrlOverlay = document.getElementById("youtubeUrlOverlay");
    const uploadOverlay = document.getElementById("uploadOverlay");
    const progressFill = document.getElementById("progressFill");


    const btnLocal = document.getElementById("btnLocal");
    const btnYoutube = document.getElementById("btnYoutube");
    const btnScreen = document.getElementById("btnScreen");
    const cancelTypeBtn = document.getElementById("cancelTypeBtn");

    const youtubeLinkInput = document.getElementById("youtubeLinkInput");
    const confirmYoutubeBtn = document.getElementById("confirmYoutubeBtn");
    const cancelYoutubeBtn = document.getElementById("cancelYoutubeBtn");

    const hiddenFileInput = document.getElementById("hiddenFileInput");


    joinBtn.onclick = () => {
      const room = roomInput.value.trim();
      if (!room) return;
      window.location.href = "room.html?room=" + room;
    };


    openCreateOverlayBtn.onclick = () => {
      createTypeOverlay.style.display = "flex";
    };

    cancelTypeBtn.onclick = () => {
      createTypeOverlay.style.display = "none";
    };


    btnLocal.onclick = () => {
      createTypeOverlay.style.display = "none";
      hiddenFileInput.click();
    };

    hiddenFileInput.onchange = () => {
      const file = hiddenFileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("media_type", "local");
      formData.append("file", file);

      uploadOverlay.style.display = "flex";
      progressFill.style.width = "0%";
      submitRoom(formData, true);
    };


    btnYoutube.onclick = () => {
      createTypeOverlay.style.display = "none";
      youtubeUrlOverlay.style.display = "flex";
      youtubeLinkInput.focus();
    };

    cancelYoutubeBtn.onclick = () => {
      youtubeUrlOverlay.style.display = "none";
      youtubeLinkInput.value = "";
    };

    confirmYoutubeBtn.onclick = () => {
      let link = youtubeLinkInput.value.trim();
      if (!link) {
        alert("Please paste a valid YouTube URL.");
        return;
      }

      let videoId = "";
      try {
        if (link.includes("v=")) {
          videoId = link.split("v=")[1].split("&")[0];
        } else if (link.includes("youtu.be/")) {
          videoId = link.split("youtu.be/")[1].split("?")[0];
        } else {
          throw new Error();
        }
      } catch (e) {
        alert("Invalid youtube link format.");
        return;
      }

      youtubeUrlOverlay.style.display = "none";
      youtubeLinkInput.value = "";

      const formData = new FormData();
      formData.append("media_type", "youtube");
      formData.append("media_source", videoId);

      submitRoom(formData, false);
    };


    btnScreen.onclick = () => {
      createTypeOverlay.style.display = "none";
      const formData = new FormData();
      formData.append("media_type", "screen");
      formData.append("media_source", "screen-share");
      submitRoom(formData, false);
    };


    function submitRoom(formData, isLocalUpdate) {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `${BACKEND_URL}/create-room`, true);

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable && isLocalUpdate) {
          const percent = (event.loaded / event.total) * 100;
          progressFill.style.width = percent + "%";
        }
      };

      xhr.onload = function () {
        uploadOverlay.style.display = "none";
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          if (data.room_id) {
            window.location.href = "room.html?room=" + data.room_id;
          }
        } else {
          alert("Failed to create room.");
        }
      };

      xhr.onerror = function () {
        uploadOverlay.style.display = "none";
        alert("Network error. Is the backend running?");
      };

      xhr.send(formData);
    }
  </script>

</body>

</html>
